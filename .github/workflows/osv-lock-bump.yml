name: OSV lock bump (temporary)

on:
  push:
    branches: [ci/supply-chain-audit]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/supply-chain-audit
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Bump mkdocs-material
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv lock --upgrade-package mkdocs-material
      - name: Commit lockfile and remove this workflow
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          rm -f .github/workflows/osv-lock-bump.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/osv-lock-bump.yml || true
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "fix(deps): bump mkdocs-material for osv"
          git push
